<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f8fc" />
  <meta name="description" content="AIの思考ログから頻出する英単語を見つけ、あなた専用の単語帳で復習。ファイルはブラウザ内で処理します。" />
  <title>LearnThinking — AIの思考から英単語を学ぶ</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="LearnThinking ホーム">
        <span class="brand-icon"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M6 12.5c0-4 3.5-7 7.5-7 3 0 5.4 1.8 6.3 4.2 3.9.2 6.2 2.9 6.2 6.2 0 3-1.6 5.1-4.5 6.1v4.5h-9V23C8.4 22.1 6 18.2 6 14.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 13.5h10M13 18h6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span>
        <span class="brand-text">learn<span>thinking</span><small>THINK. LEARN. REMEMBER.</small></span>
      </a>
      <div class="sidebar-caption">ワークスペース</div>
      <nav class="nav-list" aria-label="メインメニュー">
        <button class="nav-item active" data-nav="dashboard"><span class="nav-icon" data-icon="home"></span>ダッシュボード</button>
        <button class="nav-item" data-nav="words"><span class="nav-icon" data-icon="book"></span>単語帳 <span class="nav-count" id="nav-word-count">0</span></button>
        <button class="nav-item" data-nav="study"><span class="nav-icon" data-icon="layers"></span>フラッシュカード</button>
        <button class="nav-item" data-nav="sessions"><span class="nav-icon" data-icon="folder"></span>セッション</button>
      </nav>
      <div class="sidebar-caption tools-caption">管理</div>
      <nav class="nav-list" aria-label="設定メニュー">
        <button class="nav-item" data-nav="settings"><span class="nav-icon" data-icon="settings"></span>設定とデータ</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="privacy-box"><span class="privacy-dot"></span><strong>プライベートな学習空間</strong><p>読み込んだファイルは外部に送信されません。</p></div>
        <div class="sidebar-credit">MADE FOR CURIOUS MINDS <span>✳</span></div>
      </div>
    </aside>
    <div class="main-area">
      <header class="topbar">
        <div class="topbar-left"><button class="icon-btn mobile-menu" id="mobile-menu" aria-label="メニューを開く"><span data-icon="menu"></span></button><span class="breadcrumb">ワークスペース <span class="sep">/</span> <strong id="breadcrumb-current">ダッシュボード</strong></span></div>
        <div class="topbar-right"><span class="local-pill"><span class="local-dot"></span>ローカル保存</span><button class="btn btn-primary btn-small" id="top-import"><span data-icon="plus"></span>ログを追加</button></div>
      </header>
      <main class="content" id="main" tabindex="-1"></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="file-input" type="file" multiple accept=".json,.jsonl,.txt,.md,.markdown" hidden />
  <input id="folder-input" type="file" multiple webkitdirectory directory hidden />
  <script type="module" src="./src/app.js"></script>
</body>
</html>
